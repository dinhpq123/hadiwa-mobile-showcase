<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Hadiwa — Trợ lý AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script src="../../shared/js/theme-receiver.js"></script>
<link rel="stylesheet" href="../../themes/presets/all-presets.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg-app); }
body { width: 100%; height: 100vh; background: var(--bg-app); color: var(--text-main); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; overflow: hidden; }
.ai-screen { display: flex; flex-direction: column; height: 100vh; padding: 14px 14px 10px; }
.ai-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.ai-icon-sq { width: 40px; height: 40px; border-radius: 12px; background: var(--primary-soft); border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; color: var(--text-sub); }
.ai-header-title { font-size: 17px; font-weight: 700; color: var(--text-main); text-align: center; }
.ai-role-pill { font-size: 9.5px; font-weight: 700; color: var(--success); text-align: center; margin-top: 2px; }
.ai-hero-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 10px; }
.ai-mascot-ring-hero { width: 100px; height: 100px; border-radius: 50%; background: var(--accent-soft); border: 2.5px solid var(--accent); box-shadow: var(--accent-glow); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; overflow: hidden; }
.ai-welcome-title { font-size: 19px; font-weight: 700; color: var(--text-main); line-height: 1.35; max-width: 280px; margin-bottom: 10px; }
.ai-welcome-desc { font-size: 11.5px; color: var(--text-sub); line-height: 1.5; max-width: 280px; }
.ai-pills-carousel { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.ai-pill-item { padding: 10px 16px; border-radius: 18px; background: var(--primary-soft); border: 1px solid var(--primary); font-size: 11.5px; font-weight: 600; color: var(--primary); white-space: nowrap; cursor: pointer; flex-shrink: 0; }
.ai-pill-item.pill-secondary { background: var(--secondary-soft); border-color: var(--secondary); color: var(--secondary); }
.ai-pill-item.pill-accent { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.ai-bottom-dock { display: flex; align-items: center; gap: 8px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 26px; padding: 6px 8px 6px 12px; margin-bottom: 6px; }
.dock-circle-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--primary-soft); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--primary); cursor: pointer; flex-shrink: 0; }
.dock-input-field { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 12px; padding: 6px 0; }
.dock-input-field::placeholder { color: var(--text-muted); }
.dock-send-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #FFFFFF; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex-shrink: 0; }
.ai-chat-box { display: none; flex: 1; overflow-y: auto; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="ai-screen">
  <div class="ai-header-bar">
    <div class="ai-icon-sq" onclick="alert('Lịch sử trò chuyện')"><ion-icon name="time-outline"></ion-icon></div>
    <div>
      <div class="ai-header-title">Trợ lý AI</div>
      <div class="ai-role-pill">● QUẢN LÝ VẬN HÀNH</div>
    </div>
    <div class="ai-icon-sq" onclick="clearChat()"><ion-icon name="add-outline"></ion-icon></div>
  </div>

  <div class="ai-hero-center" id="aiHero">
    <div class="ai-mascot-ring-hero">
      <img src="../../shared/assets/mascot-cwa-new.png" style="width:85px;height:85px;object-fit:contain"/>
    </div>
    <div class="ai-welcome-title">Xin chào! Tôi là AI Trợ lý Hadiwa IOC</div>
    <div class="ai-welcome-desc">Hỏi tôi về sản xuất, chất lượng nước, NRW, SCADA, sự cố và công việc hiện trường...</div>
  </div>
  <div id="aiChatBox" class="ai-chat-box"></div>

  <div class="ai-pills-carousel">
    <div class="ai-pill-item" onclick="sendAiMsg('Tóm tắt tình hình cấp nước hôm nay')">Tóm tắt tình hình cấp nước hôm nay</div>
    <div class="ai-pill-item pill-secondary" onclick="sendAiMsg('Tra cứu báo cáo sản xuất')">Tra cứu báo cáo sản xuất</div>
  </div>

  <div class="ai-bottom-dock">
    <div class="dock-circle-icon" onclick="alert('Đính kèm file')"><ion-icon name="attach-outline"></ion-icon></div>
    <div class="dock-circle-icon" onclick="alert('Nhập giọng nói')"><ion-icon name="mic-outline"></ion-icon></div>
    <input type="text" class="dock-input-field" id="aiInput" placeholder="Hỏi về KPI, SCADA, NRW, sự cố..." onkeydown="if(event.key==='Enter') sendAiMsg(this.value)"/>
    <button class="dock-send-btn" onclick="sendAiMsg(document.getElementById('aiInput').value)"><ion-icon name="send"></ion-icon></button>
  </div>
</div>
<script>
function sendAiMsg(txt) {
  if(!txt.trim()) return;
  document.getElementById('aiHero').style.display = 'none';
  var box = document.getElementById('aiChatBox');
  box.style.display = 'block';
  var u = document.createElement('div');
  u.style.cssText = 'background:var(--primary);color:#0F172A;padding:10px 14px;border-radius:16px 16px 2px 16px;margin:6px 0;max-width:80%;margin-left:auto;font-size:12px;font-weight:600;';
  u.textContent = txt;
  box.appendChild(u);
  document.getElementById('aiInput').value = '';
  setTimeout(() => {
    var b = document.createElement('div');
    b.style.cssText = 'background:var(--card-bg);color:var(--text-main);border:1px solid var(--card-border);padding:10px 14px;border-radius:16px 16px 16px 2px;margin:6px 0;max-width:85%;font-size:12px;line-height:1.4;';
    b.textContent = 'Dữ liệu IOC: Sản lượng toàn hệ thống 48.950 m3 (99.2% KH). NRW 9.9%. Không ghi nhận sự cố nghiêm trọng.';
    box.appendChild(b);
    box.scrollTop = box.scrollHeight;
  }, 600);
}
function clearChat() {
  document.getElementById('aiChatBox').innerHTML = '';
  document.getElementById('aiChatBox').style.display = 'none';
  document.getElementById('aiHero').style.display = 'flex';
}
</script>
</body>
</html>
