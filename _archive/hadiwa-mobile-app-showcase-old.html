<!DOCTYPE html>
<html lang="vi" data-theme="hadiwa-original" data-mode="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Hadiwa Mobile App — Exact UI Pixel Perfect Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   1. MÃ MÀU VÀ TOKENS KHIỂN CSS CHUẨN 100% NHƯ SIMULATOR IPHONE
═══════════════════════════════════════════════════════════════════════════ */
:root {
  --bg-app: #0b0f1d;
  --header-bg: #12182b;
  --card-bg: #141c33;
  --card-border: #202b48;
  
  --text-main: #FFFFFF;
  --text-sub: #94A3B8;
  --text-muted: #64748B;
  
  --primary: #00F2FF;
  --primary-purple: #7C3AED;
  --accent-blue: #6366F1;
  
  --tabbar-bg: #0f1526;
  --tabbar-border: #1c2640;
  --tab-active-bg: #7C3AED;
  
  --floating-btn-bg: #0099FF;
  --floating-btn-shadow: 0 6px 20px rgba(0, 153, 255, 0.5);

  --tr: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-mode="light"] {
  --bg-app: #F4F5FB !important;
  --header-bg: #FFFFFF !important;
  --card-bg: #FFFFFF !important;
  --card-border: #E2E4F0 !important;
  --text-main: #14132B !important;
  --text-sub: #52537A !important;
  --text-muted: #8E8EA8 !important;
  --tabbar-bg: #FFFFFF !important;
  --tabbar-border: #E2E4F0 !important;
}

[data-theme="evg-green"] {
  --bg-app: #07150E;
  --header-bg: #0C1F15;
  --card-bg: #0C1F15;
  --card-border: rgba(48, 189, 111, 0.25);
  --text-main: #F0FFF6;
  --text-sub: #9CA2B8;
  --primary: #30BD6F;
  --tabbar-bg: #091A12;
  --tabbar-border: rgba(48, 189, 111, 0.25);
  --floating-btn-bg: #30BD6F;
}

/* ═══════════════════════════════════════════════════════════════════════════
   2. FRAME 390x844 CHÍNH XÁC
═══════════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #05070f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: auto; }

.prototype-controls { position: fixed; top: 16px; right: 16px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(124, 58, 237, 0.4); padding: 10px 14px; border-radius: 12px; z-index: 9999; display: flex; gap: 10px; align-items: center; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.prototype-controls select { background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 8px; border-radius: 6px; font-size: 11px; outline: none; cursor: pointer; }

.mobile-device { width: 390px; height: 844px; background: var(--bg-app); border-radius: 48px; border: 10px solid #1c1936; box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 0 2px rgba(255,255,255,0.1); position: relative; overflow: hidden; display: flex; flex-direction: column; }

.status-bar { height: 44px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: var(--text-main); position: absolute; top: 0; left: 0; right: 0; z-index: 1001; }
.mobile-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 125px; height: 30px; background: #000; border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; z-index: 1000; display: flex; justify-content: center; align-items: center; }
.mobile-camera { width: 12px; height: 12px; background: #111; border-radius: 50%; border: 1px solid #222; }

.mobile-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-top: 44px; position: relative; }
.screen-scroll-container { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 110px; }
::-webkit-scrollbar { width: 0; }

.floating-settings-btn { position: absolute; bottom: 82px; right: 16px; width: 48px; height: 48px; border-radius: 50%; background: var(--floating-btn-bg); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: var(--floating-btn-shadow); z-index: 880; cursor: pointer; border: 2px solid rgba(255,255,255,0.4); }
.floating-settings-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; }

/* ═══════════════════════════════════════════════════════════════════════════
   3. BOTTOM TAB BAR FIX CHUẨN KÍCH THƯỚC VÀ SPACING
═══════════════════════════════════════════════════════════════════════════ */
.mobile-tab-bar-wrapper { position: absolute; bottom: 12px; left: 14px; right: 14px; height: 64px; z-index: 900; }
.mobile-tab-bar { height: 100%; background: var(--tabbar-bg); border: 1px solid var(--tabbar-border); border-radius: 36px; backdrop-filter: blur(20px); display: flex; align-items: flex-end; justify-content: space-around; padding: 0 6px 6px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; color: var(--text-sub); }
.tab-item.active { color: #FFFFFF; }
.tab-icon-box { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
.tab-item.active .tab-icon-box { background: var(--tab-active-bg); box-shadow: 0 0 12px rgba(124, 58, 237, 0.5); }
.tab-label { font-size: 8px; font-weight: 600; text-transform: uppercase; margin-top: 1px; }

.tab-item-center { position: relative; top: -16px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.center-mascot-ring { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle, rgba(124,58,237,0.4) 0%, rgba(20,16,45,0.85) 100%); border: 2px solid #7C3AED; box-shadow: 0 0 20px rgba(124,58,237,0.6); display: flex; align-items: center; justify-content: center; }
.center-mascot-img { width: 40px; height: 40px; object-fit: contain; }
.center-tab-label { font-size: 8.5px; font-weight: 700; color: #9FA0C3; margin-top: 2px; }

/* ═══════════════════════════════════════════════════════════════════════════
   4. STYLING CHI TIẾT MÀN TRỢ LÝ AI (FIXED CHUẨN TỶ LỆ 100% CẢ NÚT LỊCH SỬ)
═══════════════════════════════════════════════════════════════════════════ */
.ai-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; margin-top: 4px; }
.ai-icon-sq { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 16px; cursor: pointer; }
.ai-header-center { text-align: center; }
.ai-header-title { font-size: 16px; font-weight: 700; color: #FFFFFF; }
.ai-role-pill-green { display: inline-block; padding: 2px 10px; border-radius: 12px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #10B981; font-size: 9.5px; font-weight: 700; text-transform: uppercase; margin-top: 3px; letter-spacing: 0.5px; }

.ai-hero-center { text-align: center; margin-top: 20px; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
.ai-mascot-ring-hero { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(124,58,237,0.35) 0%, rgba(13,18,34,0.9) 100%); border: 2px solid #7C3AED; box-shadow: 0 0 30px rgba(124,58,237,0.4); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
.ai-mascot-hero-img { width: 78px; height: 78px; object-fit: contain; }

.ai-welcome-title { font-size: 20px; font-weight: 700; color: #FFFFFF; margin-bottom: 12px; line-height: 1.3; max-width: 300px; }
.ai-welcome-desc { font-size: 12.5px; color: #94A3B8; line-height: 1.5; max-width: 290px; }

/* Chips Carousel */
.ai-pills-carousel { display: flex; gap: 8px; overflow-x: auto; margin-top: 30px; padding-bottom: 4px; scrollbar-width: none; }
.ai-pill-item { padding: 11px 18px; border-radius: 24px; background: rgba(124, 58, 237, 0.18); border: 1px solid rgba(124, 58, 237, 0.4); color: #C4B5FD; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }

/* Dynamic Chat Area */
.ai-chat-history-box { margin-top: 14px; margin-bottom: 14px; }

/* Bottom Fixed Composer Bar */
.ai-bottom-dock { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 10px; }
.dock-circle-icon { width: 38px; height: 38px; border-radius: 50%; background: rgba(124, 58, 237, 0.18); border: 1px solid rgba(124, 58, 237, 0.35); color: #C4B5FD; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; }
.dock-input-field { flex: 1; padding: 12px 18px; border-radius: 24px; background: #141c33; border: 1px solid #202b48; color: #FFFFFF; font-size: 12px; outline: none; }
</style>
</head>
<body>

<!-- CONTROLLER TRANG PROTOTYPE CHO DEV/ADMIN NẰM NGOÀI KHUNG ĐIỆN THOẠI -->
<div class="prototype-controls">
  <span style="font-size:11px;font-weight:700;color:#00F2FF">📱 MOBILE SHOWCASE</span>
  <select id="presetSelect" onchange="applyPreset(this.value)">
    <option value="hadiwa-original">Hadiwa Original</option>
    <option value="violet-intelligence">Trí tuệ Tím</option>
    <option value="ocean-technology">Hạ tầng Đại dương</option>
    <option value="emerald-water">Nước Ngọc lục</option>
    <option value="evg-green">EVG Xanh năng lượng ⭐</option>
  </select>
  <select id="modeSelect" onchange="applyMode(this.value)">
    <option value="dark">Dark Mode</option>
    <option value="light">Light Mode</option>
  </select>
</div>

<!-- KHUNG ĐIỆN THOẠI MOBILE 390x844 -->
<div class="mobile-device">
  <!-- Status Bar 8:28 -->
  <div class="status-bar">
    <span>8:28</span>
    <div style="display:flex;gap:4px"><span>📶</span><span>📡</span><span>🔋</span></div>
  </div>
  <div class="mobile-notch"><div class="mobile-camera"></div></div>

  <!-- Nút Cài đặt Nổi màu Xanh Dương -->
  <div class="floating-settings-btn" title="Cài đặt hệ thống" onclick="openDetail('AppearanceSettings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
  </div>

  <div class="mobile-body">
    <!-- Container Nội dung Màn hình Mobile -->
    <div class="screen-scroll-container" id="mobileScreenRoot">
      <!-- Dynamic Screen Content -->
    </div>

    <!-- Bottom Tab Bar -->
    <div class="mobile-tab-bar-wrapper">
      <div class="mobile-tab-bar">
        <div class="tab-item" id="tab-Home" onclick="switchTab('Home')">
          <div class="tab-icon-box">🏠</div>
          <span class="tab-label">TỔNG QUAN</span>
        </div>
        <div class="tab-item" id="tab-Approvals" onclick="switchTab('Approvals')">
          <div class="tab-icon-box">📋</div>
          <span class="tab-label">Phê duyệt</span>
        </div>
        <div class="tab-item-center active" id="tab-AIAssistant" onclick="switchTab('AIAssistant')">
          <div class="center-mascot-ring">
            <img src="hadiwa-mobile/assets/image-icon/mascot-cwa-new.png" class="center-mascot-img" alt="Mascot CWA"/>
          </div>
          <span class="center-tab-label">Trợ lý AI</span>
        </div>
        <div class="tab-item" id="tab-Operations" onclick="switchTab('Operations')">
          <div class="tab-icon-box">🛡️</div>
          <span class="tab-label">Giám sát</span>
        </div>
        <div class="tab-item" id="tab-Settings" onclick="switchTab('Settings')">
          <div class="tab-icon-box">👤</div>
          <span class="tab-label">Tài khoản</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// ROUTER SPA — MỌI MÀN HÌNH ĐỀU ĐƯỢC LƯU V NGUYÊN TRẠNG NGUYÊN BẢN
// ═══════════════════════════════════════════════════════════════════════════
let currentTab = 'AIAssistant';
let approvalTab = 'pending';
let selectedYear = '2026';
let selectedMonth = 'Tháng 7';

function switchTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-item, .tab-item-center').forEach(el => el.classList.remove('active'));
  const activeTab = document.getElementById('tab-' + tabName);
  if(activeTab) activeTab.classList.add('active');

  const root = document.getElementById('mobileScreenRoot');

  if(tabName === 'Home') root.innerHTML = renderHomeScreen();
  else if(tabName === 'Approvals') root.innerHTML = renderApprovalsScreen();
  else if(tabName === 'AIAssistant') root.innerHTML = renderAiScreen();
  else if(tabName === 'Operations') root.innerHTML = renderOperationsScreen();
  else if(tabName === 'Settings') root.innerHTML = renderSettingsScreen();
}

// 1. MÀN TRỢ LÝ AI (PIXEL PERFECT VỚI SIMULATOR IPHONE SCREENSHOT 8:28)
function renderAiScreen() {
  return `
  <div style="display:flex;flex-direction:column;min-height:100%">
    <!-- Top Bar với Nút Lịch Sử Tròn Bo Đúng Chuẩn Simulator -->
    <div class="ai-header-bar">
      <div class="ai-icon-sq" title="Lịch sử" onclick="alert('Lịch sử trò chuyện')">🕒</div>
      <div class="ai-header-center">
        <div class="ai-header-title">Trợ lý AI</div>
        <div class="ai-role-pill-green">● QUẢN LÝ VẬN HÀNH</div>
      </div>
      <div class="ai-icon-sq" title="Mới" onclick="clearAiChat()">➕</div>
    </div>

    <!-- Mascot Circle Hero -->
    <div class="ai-hero-center">
      <div class="ai-mascot-ring-hero">
        <img src="hadiwa-mobile/assets/image-icon/mascot-cwa-new.png" class="ai-mascot-hero-img" alt="Mascot CWA"/>
      </div>
      <div class="ai-welcome-title">Xin chào! Tôi là AI Trợ lý Hadiwa IOC</div>
      <div class="ai-welcome-desc">Hỏi tôi về sản xuất, chất lượng nước, NRW, SCADA, sự cố và công việc hiện trường...</div>
    </div>

    <!-- Carousel Gợi Ý -->
    <div class="ai-pills-carousel">
      <div class="ai-pill-item" onclick="sendAiMsg('Tóm tắt tình hình cấp nước hôm nay')">Tóm tắt tình hình cấp nước hôm nay</div>
      <div class="ai-pill-item" onclick="sendAiMsg('Tra cứu báo cáo sản xuất')">Tra cứu báo cáo sản xuất</div>
    </div>

    <!-- Dynamic Output Box -->
    <div id="aiChatBox" class="ai-chat-history-box"></div>

    <!-- Composer Dock -->
    <div class="ai-bottom-dock">
      <div class="dock-circle-icon" onclick="alert('Tải file')">➕</div>
      <div class="dock-circle-icon" onclick="alert('Thu âm')">🎙️</div>
      <input type="text" class="dock-input-field" id="aiInput" placeholder="Hỏi về KPI, SCADA, NRW, sự cố..." onkeydown="if(event.key==='Enter') sendAiMsg(this.value)"/>
    </div>
  </div>`;
}

function sendAiMsg(text) {
  if(!text || !text.trim()) return;
  const chatBox = document.getElementById('aiChatBox');
  if(!chatBox) return;

  const userMsg = `<div style="text-align:right;margin-bottom:8px"><span style="background:#7C3AED;color:#fff;padding:10px 14px;border-radius:16px 16px 2px 16px;font-size:12px;display:inline-block">${text}</span></div>`;
  chatBox.innerHTML += userMsg;

  const input = document.getElementById('aiInput');
  if(input) input.value = '';

  setTimeout(() => {
    const aiMsg = `<div style="text-align:left;margin-bottom:8px;display:flex;gap:8px"><img src="hadiwa-mobile/assets/image-icon/mascot-cwa-new.png" style="width:28px;height:28px;object-fit:contain"/><span style="background:#141c33;border:1px solid #202b48;color:#fff;padding:10px 14px;border-radius:16px 16px 16px 2px;font-size:12px;display:inline-block">Dữ liệu vận hành: Hệ thống hoạt động bình thường, sản lượng đạt 48.950 m3.</span></div>`;
    chatBox.innerHTML += aiMsg;
  }, 500);
}

function clearAiChat() { switchTab('AIAssistant'); }

// 2. MÀN TỔNG QUAN — NGUYÊN NGBẢN 8 SECTIONS (KHÔNG THAY ĐỔI DÙ CHỈ 1 PIXEL)
function renderHomeScreen() {
  return `
  <div style="background:#12182b;border-radius:28px;padding:18px;margin-bottom:14px;border:1px solid #202b48">
    <div style="font-size:13px;color:#94A3B8">Chào buổi tối 👋</div>
    <div style="font-size:22px;font-weight:700;color:#FFF;margin-top:2px;margin-bottom:8px">Nguyễn Đức Minh</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="padding:4px 10px;border-radius:20px;background:rgba(124,58,237,0.2);border:1px solid #7C3AED;font-size:11px;font-weight:700;color:#C4B5FD">🛡️ Quản lý</div>
        <span style="font-size:11px;color:#94A3B8;font-family:'Roboto Mono',monospace">6/8/2026</span>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer" onclick="switchTab('Approvals')">
          <span style="font-size:16px">🔔</span>
          <div style="position:absolute;top:4px;right:4px;background:#EF4444;color:#fff;font-size:9px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center">2</div>
        </div>
        <div style="width:50px;height:50px;border-radius:50%;border:2px solid #8B5CF6;overflow:hidden;background:#2B2353" onclick="switchTab('Settings')">
          <img src="hadiwa-mobile/assets/image-icon/avatar_director.png" style="width:100%;height:100%;object-fit:cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'"/>
        </div>
      </div>
    </div>
  </div>

  <div style="background:#141c33;border:1px solid #2c3a69;border-radius:20px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="switchTab('AIAssistant')">
    <div style="width:48px;height:48px;border-radius:50%;background:#3B2E68;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <img src="hadiwa-mobile/assets/image-icon/mascot-cwa-new.png" style="width:36px;height:36px;object-fit:contain"/>
    </div>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:700;color:#A5A6F6">TRỢ LÝ AI</div>
      <div style="font-size:11px;color:#94A3B8;margin-top:2px;line-height:1.4">Hôm nay hệ thống ghi nhận sản lượng ổn định. NRW hiện tại là 9.9%, tăng nhẹ 0,1% so với hôm qua.</div>
    </div>
    <span style="color:#94A3B8;font-size:18px">›</span>
  </div>

  <div style="background:#27142A;border:1px solid #8B2035;border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start" id="alert1">
    <div style="width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:18px;color:#FF4D6D">📉</span></div>
    <div style="flex:1">
      <div style="font-size:12px;font-weight:700;color:#FF4D6D">AI: Doanh thu toàn hệ thống giảm 2%</div>
      <div style="font-size:10.5px;color:#94A3B8;margin-top:2px">Phát hiện sụt giảm doanh thu bất thường tại một số khu vực quản lý.</div>
    </div>
    <span style="font-size:14px;color:#64748B;cursor:pointer" onclick="document.getElementById('alert1').remove()">✕</span>
